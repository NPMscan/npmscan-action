# OpenSSF Scorecard: scores this repo's supply-chain practices (pinned
# dependencies, token permissions, branch protection, ...) and publishes the
# result for the README badge and https://scorecard.dev.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
