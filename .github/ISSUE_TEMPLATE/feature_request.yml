name: Feature request
description: Suggest a new input, output, or check.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you'd like it to work — an input, an output, a different comment, something else.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
